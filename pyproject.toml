[project]
name = "signalbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "httpx>=0.28",
  "typer>=0.15",
  "pyyaml>=6.0",
  "yfinance>=0.2",
  "pydantic-settings>=2.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tzdata>=2024.1",
  "exchange-calendars>=4.13",
  "python-telegram-bot>=22.8,<23",
]

[project.scripts]
signalbench = "signalbench.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".agents", ".claude"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["signalbench"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["yfinance", "exchange_calendars"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
