services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signalbench
      POSTGRES_PASSWORD: signalbench
      POSTGRES_DB: signalbench
    ports:
      - "5432:5432"
    volumes:
      - signalbench_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signalbench_pg:
