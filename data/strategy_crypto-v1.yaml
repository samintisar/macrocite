# Spec 09: Breakout on BTC and ETH daily candles from Kraken. Pre-registered, one try.
# A copy of data/strategy_v2-none-cash.yaml with only version, cost_per_side, regime.symbol,
# liquidity.min_median_traded_value_usd, and the backtest dates changed, committed on its own
# before any run on real data. Do not edit: any change is a new version, reported as post-hoc.
# cost_per_side is Kraken's top published fee (KRAKEN_TOP_FEE). Every session is a calendar
# day. Crypto has no earnings dates, so the earnings rules never fire.
version: crypto-v1
start_equity: 100
risk_pct: 0.02
max_positions: 3
max_per_sector: 2
pause_drawdown: 0.15
auto_resume_sessions: 10
gap_up_limit: 0.01
cost_per_side: 0.004
setup_priority: [pullback, breakout, sentiment]
regime:
  symbol: XBTUSD
  sma: 200
indicators:
  atr_period: 14
  rsi_period: 2
liquidity:
  min_median_traded_value_usd: 0
  sessions: 20
earnings:
  blackout_sessions: 3
  exit_sessions: 2
setups:
  pullback:
    trend_sma_fast: 50
    trend_sma_slow: 200
    rsi_max: 10
    stop_low_sessions: 3
    stop_atr_mult: 0.5
    target_r: 2.0
    time_limit: 10
  breakout:
    trend_sma: 50
    lookback: 20
    volume_lookback: 50
    volume_mult: 1.5
    stop_atr_mult: 2.0
    trail_atr_mult: 3.0
    time_limit: null
  sentiment:
    trend_sma: 20
    stop_atr_mult: 2.0
    target_r: 2.0
    time_limit: 10
backtest:
  start: 2015-01-01
  h1_end: 2020-12-31
  h2_start: 2021-01-01
  recent_since: 2026-07-01
  pass_bar:
    min_trades: 30
    min_mean_r: 0.10
