# CDR bid/ask spread survey. Required before strategy_v1.yaml (spec 02).
# See docs/superpowers/specs/2026-09-22-swing-assistant-00-overview.md, "Spread survey".
#
# Source: recorded automatically from Yahoo Finance quotes (delayed up to 15 minutes; the width of
# the spread is what matters here), not typed from Wealthsimple. All 40 CDRs in the universe were
# sampled every 30 minutes from 10:00 to 15:30 America/New_York on 2026-09-24, only while Yahoo
# reported the regular session. Readings where bid == ask were dropped as likely stale or locked
# quotes, which makes the median slightly more conservative. ZPFE and ZV had no quote data.
# Yahoo does not give quote sizes for these listings.
#
# The loader computes spread_pct = (ask - bid) / midpoint. The median across all readings sets the
# backtest cost per side: max(0.2%, median / 2 + 0.1%). A median above 1% stops spec 02.

